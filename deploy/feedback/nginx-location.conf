# S-226：反馈服务的 nginx 片段
#
# 贴进 wishful-claw.work 的 server 块（**不要**动静态站那两条 location，它们是原子替换的逃生口）。
#
# 三条关键点：
#  1. `proxy_intercept_errors off` —— 否则 nginx 的 error_page 会把 4xx 换成 HTML，
#     前端 `res.json()` 直接炸，而且报错信息全变成看不懂的页面。
#  2. `^~` 前缀匹配 —— 压过任何正则 location，防止以后有人加 `\.js$` 之类的规则把 /api/ 抢走。
#  3. 管理面的口令由 basic auth 完成，进程内没有登录逻辑；服务只监听 127.0.0.1。
#
# ⚠️ X-Forwarded-For 必须用 `$remote_addr`（**覆盖**），不能用 `$proxy_add_x_forwarded_for`：
#    后者是「追加」，客户端自带的 `X-Forwarded-For: 1.2.3.4` 会被原样接在头里最前面，
#    而 `app.mjs` 取的是第一段 ⇒ 攻击者每次换一个伪造 IP 即可绕过 5 次/小时的提交限流。
#    服务只监听 127.0.0.1，唯一的对端就是本机 nginx，覆盖写的值才是真实来源。

# ── 对外接口：提交 / 公开读 ────────────────────────────────────────────────
location ^~ /api/ {
    proxy_pass              http://127.0.0.1:7860;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_intercept_errors  off;
    proxy_connect_timeout   5s;
    proxy_read_timeout      15s;
}

# ── 管理页：不带尾斜杠时补一个（404 到静态站会让人以为服务挂了）───────────
location = /admin/feedback {
    return 301 /admin/feedback/;
}

# ── 管理页与其 API ────────────────────────────────────────────────────────
# .htpasswd 用户名 alwy，密码部署时生成（见 install.md §4）
location ^~ /admin/feedback/ {
    auth_basic              "WishfulClaw Admin";
    auth_basic_user_file    /data/services/wishfulclaw-feedback/.htpasswd;

    proxy_pass              http://127.0.0.1:7860;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_intercept_errors  off;

    # 管理页不该被搜索引擎碰到（页面里也有 noindex，双保险）
    add_header              X-Robots-Tag "noindex, nofollow" always;
}
