<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>文件搜索</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* main.css 由 JS 引入，加载完成前这两个变量还没有值 —— 先给 transparent / inherit，
         加载完立刻跟上应用主题（常规窗不透明，不能像原窗那样整块透明）。 */
      html, body {
        background: var(--app-background, transparent);
        color: var(--foreground, inherit);
        font-family: var(--app-font-family, sans-serif);
        font-size: var(--app-font-size, 14px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/file-search/main.tsx"></script>
  </body>
</html>
