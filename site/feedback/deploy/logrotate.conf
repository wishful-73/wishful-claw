# S-226：反馈服务日志轮转
#
# 装到 /etc/logrotate.d/wishfulclaw-feedback
#
# 用 copytruncate 而不是 create：systemd 的 StandardOutput=append: 一直持有
# 那个文件的 fd，改名不通知等于日志继续写进旧 inode（看起来像「日志不更新了」）。
# copytruncate 是唯一不用重启服务的做法，代价是轮转瞬间可能丢几行 —— 这个量级无所谓。

/data/services/wishfulclaw-feedback/feedback.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su ubuntu ubuntu
}
