appId: com.wishfulclaw.app
productName: Wishful Claw
directories:
  output: release

afterPack: scripts/after-pack-remove-files.cjs

# ──────────────────────────────────────────────────────────────────
# 打包文件规则：白名单策略
#
# electron-vite 编译时将 TS/React 源码及绝大多数依赖打包到 out/。
# 运行时 node_modules 只需保留两类包：
#   1. 原生模块（含 .node 二进制，Vite 无法打包）
#   2. Vite external 或动态 require 子路径的包（Vite 无法静态分析）
#
# 先排除全部 node_modules，再按白名单收入运行时必需包。
# 新增依赖后无需手动维护 — 只要 Vite 能打包就不会进 asar。
# ──────────────────────────────────────────────────────────────────
files:
  - out/**/*
  - package.json
  - resources/icon-256.png
  - LICENSE
  - THIRD_PARTY_NOTICES.md

  # ── 项目文件排除 ──
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.npmrc,pnpm-lock.yaml}'

  # ── node_modules 白名单 ──
  - '!node_modules/**/*'

  # Vite external（运行时从 node_modules require）
  - node_modules/node-pty/**
  - node_modules/ssh2/**
  - node_modules/dingtalk-stream/**

  # 原生模块
  - node_modules/@jitsi/**
  - node_modules/node-gyp-build/**
  - node_modules/bufferutil/**
  - node_modules/utf-8-validate/**

  # ssh2 传递依赖
  - node_modules/asn1/**
  - node_modules/bcrypt-pbkdf/**
  - node_modules/safer-buffer/**
  - node_modules/tweetnacl/**
  - node_modules/ms/**

  # dingtalk-stream 传递依赖
  - node_modules/ws/**
  - node_modules/axios/**
  - node_modules/form-data/**
  - node_modules/proxy-from-env/**
  - node_modules/follow-redirects/**
  - node_modules/combined-stream/**
  - node_modules/mime-types/**
  - node_modules/mime-db/**
  - node_modules/asynckit/**
  - node_modules/delayed-stream/**
  - node_modules/agent-base/**
  - node_modules/https-proxy-agent/**

  # 动态 require 子路径（Vite 无法静态分析）
  - node_modules/ajv/**
  - node_modules/ajv-formats/**
  - node_modules/protobufjs/**

  # protobufjs / ajv 传递依赖
  - node_modules/@protobufjs/**
  - node_modules/long/**
  - node_modules/fast-deep-equal/**
  - node_modules/fast-uri/**
  - node_modules/json-schema-traverse/**
  - node_modules/require-from-string/**

  # ── 全局裁剪：白名单包内的非运行时文件 ──
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/{README.md,CHANGELOG.md,LICENSE,LICENSE.md}'
  - '!node_modules/**/{test,tests,docs,example,examples,demo,demos}'
  - '!node_modules/@jitsi/robotjs/{build,src,test}/**'
  - '!node_modules/@jitsi/robotjs/binding.gyp'

# 只保留中英文（删除其余 50+ 语言包，节省 ~40MB）
electronLanguages:
  - en-US
  - zh-CN

extraResources:
  - from: resources/worker
    to: worker
    filter:
      - '**/*'
  - from: resources/icon-256.png
    to: icon-256.png
  - from: resources/icon.ico
    to: icon.ico

asarUnpack:
  - resources/**
  - node_modules/node-pty/**
  - node_modules/@jitsi/robotjs/**
  - node_modules/node-gyp-build/**

npmRebuild: false

win:
  executableName: WishfulClaw
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: null
  notarize: false

linux:
  target:
    - AppImage
    - deb
  maintainer: wishful-claw
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
